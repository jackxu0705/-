<style>

#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:1;display:none}

/* ─── Controls ─── */




#controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;opacity:0;transition:opacity .6s;max-width:92vw}

#endOverlay .end-orb{position:absolute;width:50vmin;height:50vmin;border-radius:50%;

#endOverlay .end-card{padding:48px 56px;border-radius:28px;border:1px solid rgba(255,255,255,.08);

  box-shadow:0 8px 60px rgba(0,0,0,.3);


  text-align:center;transform:translateY(30px) scale(.95);opacity:0;


  }





#endOverlay .end-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 18px;

  font-size:24px;animation:endPulse 2.5s ease-in-out infinite}


@keyframes endPulse{0%,100%{box-shadow:0 0 0 0 rgba(100,200,255,.1)}50%{box-shadow:0 0 0 16px rgba(100,200,255,0)}}


#endOverlay h2{font-size:23px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:6px;letter-spacing:-.01em}


#endOverlay .end-sub{font-size:14px;color:rgba(255,255,255,.3);margin-bottom:26px;letter-spacing:.02em}

#endBtn{padding:12px 40px;border-radius:24px;border:1px solid rgba(255,255,255,.1);

  color:rgba(255,255,255,.6);font-size:13px;font-weight:500;letter-spacing:.02em;


  cursor:pointer;transition:all .35s ease;user-select:none}

.end-particle{position:absolute;border-radius:50%;background:rgba(100,200,255,.25);pointer-events:none;z-index:0;box-shadow:0 0 12px rgba(100,200,255,.08)}


#endOverlay .end-fade{position:absolute;inset:0;z-index:-1;


  background:radial-gradient(ellipse at 50% 20%,rgba(100,200,255,.06) 0%,transparent 50%)}

<script>




// ===================================================================




// SETUP




// ===================================================================




var $=s=>document.querySelector(s);




var v=$('#v'),c=$('#c'),ctx=c.getContext('2d');




// Detect file:// protocol and warn
if(location.protocol==='file:'){
  document.body.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#fff;padding:40px;text-align:center;font-family:-apple-system,sans-serif">'+

    '<p style="color:rgba(255,255,255,.3);font-size:13px;margin-top:16px">或访问 <a href="http://127.0.0.1:8768/" style="color:#64c8ff">http://127.0.0.1:8768/</a></p>'+
  '</div>';

}


window.onerror=function(msg,url,line){document.getElementById('dotLabel').textContent='JS错误: '+msg;document.getElementById('dotLabel').style.color='#ff3b30';}




window.addEventListener('unhandledrejection',function(e){document.getElementById('dotLabel').textContent='Promise错误: '+e.reason;document.getElementById('dotLabel').style.color='#ff3b30';});




var txt=$('#txt'),dot=$('#dot');




var fpsEl=$('#fps'),kpEl=$('#kp'),fcEl=$('#fc'),hcEl=$('#hc');




var info=$('#info'),controls=$('#controls'),bar=$('.bar');




var cover=$('#cover'),coverDots=($('#dots')?$('#dots').children:null),dotLabel=$('#dotLabel');




var stopBtn=$('#btnStop');









var BASE='mediapipe/';




var active=false,running=false;




var stream=null;
var _frameCount=0;




var poseReady=false,faceReady=false,handsReady=false;




var lastPose=null,lastFace=null,lastHands=null;




var CTRLS={skel:true};









function setT(s){txt.textContent=s}




function setD(s){




  dot.className=s==='go'?'go':'';




  bar.classList.toggle('on',s==='go');




}




function setCoverDot(i,ok){coverDots[i].className=ok?'ok':'off'}




function setCoverLabel(s){dotLabel.textContent=s}









// Debug: show errors on screen




function showCoverError(msg){




  dotLabel.textContent=msg;




  dotLabel.style.color="#ff3b30";




  dotLabel.style.fontSize="13px";




}

// ── Temporal smoothing for hand landmarks (reduces jitter/misalignment) ──
var _smoothHands=[],_smoothFactor=0.55;
function _smoothHL(raw){
  if(!raw||!raw.length){_smoothHands=[];return raw;}
  var out=[];
  for(var h=0;h<raw.length;h++){
    var src=raw[h];if(!src||src.length<21){out.push(src);continue;}
    var prev=_smoothHands[h]||null;var dst=[];
    for(var j=0;j<21;j++){
      if(!src[j]){dst.push(src[j]);continue;}
      if(prev&&prev[j]){
        dst.push({x:prev[j].x*_smoothFactor+src[j].x*(1-_smoothFactor),
                  y:prev[j].y*_smoothFactor+src[j].y*(1-_smoothFactor),
                  z:prev[j].z*_smoothFactor+src[j].z*(1-_smoothFactor)});
      }else{dst.push({x:src[j].x,y:src[j].y,z:src[j].z});}
    }
    out.push(dst);
  }
  _smoothHands=out;
  return out;
}














function rs(){
  var W=innerWidth,H=innerHeight,dpr=1;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);




}




addEventListener('resize',rs);rs();









// Coordinate mapping (mirrored for selfie)




function X(p){
  // Cache video dims per frame
  if(X._f!==_frameCount){X._f=_frameCount;var w=v.videoWidth,h=v.videoHeight,W=innerWidth,H=innerHeight;
    if(w&&h){var s=Math.max(W/w,H/h);X._ox=(w*s-W)/2/(w*s);X._oy=(h*s-H)/2/(h*s);X._W=W}else{X._ox=0;X._oy=0;X._W=W}}
  return(1-(p.x-X._ox)/(1-2*X._ox))*X._W
}
function Y(p){
  if(Y._f!==_frameCount){Y._f=_frameCount;var w=v.videoWidth,h=v.videoHeight,W=innerWidth,H=innerHeight;
    if(w&&h){var s=Math.max(W/w,H/h);Y._ox=(w*s-W)/2/(w*s);Y._oy=(h*s-H)/2/(h*s);Y._H=H}else{Y._ox=0;Y._oy=0;Y._H=H}}
  return((p.y-Y._oy)/(1-2*Y._oy))*Y._H
}









// ─── Pose skeleton connections (BODY ONLY, no hand fingers: remove landmarks 17-22) ───




var PC=[[0,1],[1,2],[2,3],[0,4],[4,5],[5,6],[3,7],[6,8],[9,10],[7,9],[8,10],




        [11,13],[13,15],[12,14],[14,16],




        [11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],




        [27,29],[29,31],[27,31],[28,30],[30,32],[28,32]];









var HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];









function calcAngle(a,b,c){
  var ab={x:X(a)-X(b),y:Y(a)-Y(b)};
  var bc={x:X(c)-X(b),y:Y(c)-Y(b)};
  var d=ab.x*bc.x+ab.y*bc.y;
  var m=Math.sqrt(ab.x*ab.x+ab.y*ab.y)*Math.sqrt(bc.x*bc.x+bc.y*bc.y);
  if(m<1e-6)return 0;
  return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
}

function loadScript(src){




  return new Promise(function(ok,no){




    var e=document.createElement('script');




    e.src=src;e.onload=ok;e.onerror=no;




    document.head.appendChild(e);




  });




}









// ===================================================================




// COVER FLOW




// ===================================================================




var coverHidden=false;









// Delay startup until DOM is fully ready




var _startBtn=document.getElementById('startBtn');




if(_startBtn)_startBtn.addEventListener('click',async function(){




  if(coverHidden)return;




  try{




    coverHidden=true;




    setCoverLabel('正在初始化...');




    setCoverDot(0,true);




    setCoverLabel('加载模型中...');




    var ok=await loadModels();




    if(!ok){showCoverError('模型加载失败，查看控制台');return}




    setCoverDot(1,true);




    setCoverLabel('启动摄像头...');




    var camOK=await startCam();




    if(!camOK){showCoverError('摄像头被拒绝，允许权限后重试');return}




    setCoverDot(2,true);




    setCoverLabel('就绪！');




    cover.classList.add("hide");




    setTimeout(function(){




      cover.style.display='none';




      info.classList.remove('stopped');
      info.classList.add('on');




      controls.classList.remove('stopped');
      controls.classList.add('on');




      var _sbR=document.getElementById('stopBtn');if(_sbR){_sbR.disabled=false;_sbR.innerHTML='<span>✕</span> <span>停止</span>';}
      stopBtn.style.display='block';




      setD('go');




      _startTime=Date.now();




      active=true;




      loop();




      render();




    }, 300);




  } catch(e){




    console.error('[AR] Fatal:',e);




    showCoverError('错误: '+e.message);




  }




});




// MODEL LOADING




// ===================================================================




async function loadModels(){




  try{




    await loadScript(BASE+'pose.js');




    if(typeof Pose!=='undefined'){




      var p=new Pose({locateFile:f=>BASE+f});




      p.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,




        minDetectionConfidence:.5,minTrackingConfidence:.5});




      p.onResults(function(r){lastPose=r;console.log("[Pose]",r.poseLandmarks?r.poseLandmarks.length:0)});




      await p.initialize();




      window._pose=p;poseReady=true;




    }




  }catch(e){console.error('Pose err',e)}




  try{




    await loadScript(BASE+'face_mesh.js');




    if(typeof FaceMesh!=='undefined'){




      var f=new FaceMesh({locateFile:fn=>BASE+fn});




      f.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});




      f.onResults(function(r){lastFace=r;console.log("[Face]",r.multiFaceLandmarks?r.multiFaceLandmarks.length:0)});




      await f.initialize();




      window._face=f;faceReady=true;




    }




  }catch(e){console.error('Face err',e)}




  try{




    await loadScript(BASE+'hands.js');




    if(typeof Hands!=='undefined'){




      var h=new Hands({locateFile:fn=>BASE+fn});




      h.setOptions({modelComplexity:1,maxNumHands:2,minDetectionConfidence:.5,minTrackingConfidence:.5});




      h.onResults(function(r){lastHands=r;console.log("[Hands]",r.multiHandLandmarks?r.multiHandLandmarks.length:0)});




      await h.initialize();




      window._hands=h;handsReady=true;




    }




  }catch(e){console.error('Hands err',e)}




  return poseReady||faceReady||handsReady;




}









// ===================================================================




// CAMERA




// ===================================================================




async function startCam(){




  try{




    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});




    var _vs=document.getElementById('v');if(!_vs)return false;




    _vs.srcObject=stream;




    await _vs.play();




    _vs.classList.add('on');




    return true;




  }catch(e){console.error('Camera err',e);return false}




}









function stopCam(){




  active=false;




  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}




  var _v2=document.getElementById('v');if(_v2){_v2.srcObject=null;_v2.classList.add('stopped');}




  var _i2=document.getElementById('info');if(_i2)_i2.classList.add('stopped');var _c2=document.getElementById('controls');if(_c2)_c2.classList.add('stopped');




  var _sb2=document.getElementById('stopBtn');if(_sb2){_sb2.disabled=true;_sb2.innerHTML='<span>✓</span> <span>已结束</span>';}




  var _cc=document.getElementById('c');if(_cc){var _cctx=_cc.getContext('2d');_cctx.clearRect(0,0,innerWidth,innerHeight);}




  setT('待机');setD('');




  // cleaned up




  [window._pose,window._face,window._hands].forEach(function(m){




    if(m){try{m.close()}catch(e){}}




  });




  window._pose=null;window._face=null;window._hands=null;




  poseReady=false;faceReady=false;handsReady=false;




  lastPose=null;lastFace=null;lastHands=null;




}









var endOverlay=document.getElementById('endOverlay');



var endBtn=document.getElementById('endBtn');



var endFrames=document.getElementById('endFrames');



var endTime=document.getElementById('endTime');



var _startTime=0;







// ========== Force end overlay (safety net) ==========
function forceEndOverlay(){
  try{
    var el=document.getElementById('endOverlay');
    if(!el)return;
    el.style.cssText='opacity:1!important;pointer-events:auto!important;display:flex!important';

  }catch(e){console.warn('[forceEndOverlay]',e)}
